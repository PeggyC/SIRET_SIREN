<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Recherche entreprise</title>

  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      color: #333;
    }

    h2 {
      margin-top: 0;
    }

    button {
      padding: 8px 14px;
      margin: 5px 5px 5px 0;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      background: #1976d2;
      color: white;
    }

    button:hover {
      background: #125ca1;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    #status {
      margin: 15px 0;
      padding: 10px;
      border-radius: 5px;
      background: #f2f2f2;
    }

    .success {
      background: #e8f5e9 !important;
      color: #2e7d32;
    }

    .error {
      background: #ffebee !important;
      color: #c62828;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 15px;
    }

    td {
      padding: 7px;
      border-bottom: 1px solid #ddd;
    }

    td:first-child {
      font-weight: bold;
      width: 40%;
    }
  </style>
</head>

<body>

  <h2>Recherche entreprise</h2>

  <div>
    <button id="searchBtn" onclick="searchCompany()">
      🔍 Rechercher
    </button>

    <button id="updateBtn" onclick="updateGrist()" disabled>
      💾 Mettre à jour Grist
    </button>
  </div>

  <div id="status">
    Sélectionnez une ligne contenant un SIRET ou un SIREN.
  </div>

  <div id="result"></div>

<script>

  // ============================================================
  // CONFIGURATION
  // ============================================================

  const COLONNES = {
    SIRET: "SIRET",
    SIREN: "SIREN",
    RAISON_SOCIALE: "Denomination",
    SIGLE: "sigle",
    DATE_CREATION: "date_creation",
    DATE_FERMETURE: "date_fermeture",
    CATEGORIE: "categorie_entreprise",
    FORME_JURIDIQUE: "forme_juridique",
    APE: "APE",
    ADRESSE: "Adresse",
    CODE_POSTAL: "Code_postal",
    VILLE: "Ville"
  };

  let currentRecord = null;
  let currentResult = null;
  let currentRecordId = null;

  // ============================================================
  // CONNEXION À GRIST
  // ============================================================

  grist.ready({
    requiredAccess: "full"
  });

  grist.onRecord(function(record) {

    currentRecord = record;
    currentRecordId = record.id;
    currentResult = null;
    
    console.log("Record reçu :", record);
    console.log("ID de la ligne :", currentRecordId);

    document.getElementById("updateBtn").disabled = true;

    updateInterface();
  });


  // ============================================================
  // INTERFACE
  // ============================================================

  function updateInterface() {

    const status = document.getElementById("status");
    const resultDiv = document.getElementById("result");

    resultDiv.innerHTML = "";

    if (!currentRecord) {

      status.className = "";
      status.textContent =
        "Sélectionnez une ligne contenant un SIRET ou un SIREN.";

      return;
    }

    const identifier = getIdentifier();

    if (!identifier) {

      status.className = "error";

      status.textContent =
        "Aucun SIRET ou SIREN valide trouvé dans la ligne sélectionnée.";

      return;
    }

    status.className = "";

    status.textContent =
      "Identifiant détecté : " +
      identifier.value +
      " (" +
      identifier.type +
      ")";
  }


  // ============================================================
  // RÉCUPÉRATION DU SIRET / SIREN
  // ============================================================

  function getIdentifier() {

    if (!currentRecord) {
      return null;
    }

    let siret = currentRecord[COLONNES.SIRET];
    let siren = currentRecord[COLONNES.SIREN];

    if (siret !== null && siret !== undefined) {

      siret = String(siret).replace(/\s/g, "");

      if (/^\d{14}$/.test(siret)) {

        return {
          type: "SIRET",
          value: siret
        };
      }
    }

    if (siren !== null && siren !== undefined) {

      siren = String(siren).replace(/\s/g, "");

      if (/^\d{9}$/.test(siren)) {

        return {
          type: "SIREN",
          value: siren
        };
      }
    }

    return null;
  }


  // ============================================================
  // RECHERCHE API
  // ============================================================

  async function searchCompany() {

    const status = document.getElementById("status");
    const resultDiv = document.getElementById("result");
    const updateBtn = document.getElementById("updateBtn");

    updateBtn.disabled = true;
    currentResult = null;

    const identifier = getIdentifier();

    if (!identifier) {

      status.className = "error";

      status.textContent =
        "Veuillez renseigner un SIRET ou un SIREN valide.";

      return;
    }

    status.className = "";

    status.textContent =
      "Recherche en cours pour " +
      identifier.value +
      "…";

    resultDiv.innerHTML = "";

    try {

      const url =
        "https://recherche-entreprises.api.gouv.fr/search?q=" +
        encodeURIComponent(identifier.value) +
        "&page=1&per_page=10";

      const response = await fetch(url);

      if (!response.ok) {

        throw new Error(
          "Erreur API : " +
          response.status +
          " " +
          response.statusText
        );
      }

      const data = await response.json();

      if (!data.results || data.results.length === 0) {

        throw new Error(
          "Aucune entreprise trouvée pour " +
          identifier.value
        );
      }

      let result = data.results[0];

      // Si recherche par SIRET, on essaie de trouver
      // exactement le SIRET demandé.
      if (identifier.type === "SIRET") {

        const exactMatch = data.results.find(function(item) {

          return item.siege &&
                 item.siege.siret === identifier.value;

        });

        if (exactMatch) {
          result = exactMatch;
        }
      }

      currentResult = result;

      displayResult(result);

      updateBtn.disabled = false;

      status.className = "success";

      status.textContent =
        "Entreprise trouvée.";

    } catch (error) {

      console.error(error);

      status.className = "error";

      status.textContent =
        "Erreur lors de la recherche : " +
        error.message;

    }
  }


  // ============================================================
  // EXTRACTION DES DONNÉES
  // ============================================================

  console.log("CURRENT RESULT :", result);
  
  function extractCompanyData(result) {

    const siege = result.siege || {};

    let adresse = "";

    if (siege.numero_voie) {
      adresse += siege.numero_voie + " ";
    }

    if (siege.type_voie) {
      adresse += siege.type_voie + " ";
    }

    if (siege.libelle_voie) {
      adresse += siege.libelle_voie;
    }

    adresse = adresse.trim();

    return {

      SIREN:
        result.siren || "",

      SIRET:
        siege.siret || "",

      RAISON_SOCIALE:
        result.nom_complet ||
        result.nom_raison_sociale ||
        "",

      SIGLE:
        result.sigle || "",

      DATE_CREATION:
        result.date_creation || "",

      DATE_FERMETURE:
        siege.date_fermeture ||
        result.date_fermeture ||
        "",

      CATEGORIE:
        result.categorie_entreprise || "",

      /*FORME_JURIDIQUE:
        result.libelle_forme_juridique  || "",*/
      
      FORME_JURIDIQUE:
        result.libelle_nature_juridique ||
        result.nature_juridique_libelle ||
        result.nature_juridique ||
        "",

      APE:
        siege.activite_principale || "",

      ADRESSE:
        adresse,

      CODE_POSTAL:
        siege.code_postal || "",

      VILLE:
        siege.libelle_commune || ""
    };
  }
  
  console.log("DATA EXTRAITE :", data);

  // ============================================================
  // FORMATAGE DES DATES
  // ============================================================

  function formatDate(date) {

    if (!date) {
      return "";
    }

    // Si ce n'est pas une date YYYY-MM-DD,
    // on retourne la valeur telle quelle.
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) {
      return date;
    }

    const parts = date.split("-");

    return parts[2] + "/" +
           parts[1] + "/" +
           parts[0];
  }


  // ============================================================
  // AFFICHAGE DU RÉSULTAT
  // ============================================================

  function displayResult(result) {

    const resultDiv = document.getElementById("result");

    const data = extractCompanyData(result);

    const rows = [

      ["SIREN", data.SIREN],

      ["SIRET du siège", data.SIRET],

      ["Dénomination", data.RAISON_SOCIALE],

      ["Sigle", data.SIGLE],

      ["Date de création",
       formatDate(data.DATE_CREATION)],

      ["Date de fermeture",
       formatDate(data.DATE_FERMETURE)],

      ["Catégorie d'entreprise",
       data.CATEGORIE],

      ["Forme juridique",
       data.FORME_JURIDIQUE],

      ["Code APE",
       data.APE],

      ["Adresse",
       data.ADRESSE],

      ["Code postal",
       data.CODE_POSTAL],

      ["Commune",
       data.VILLE]
    ];

    let html = "<table>";

    rows.forEach(function(row) {

      html +=
        "<tr>" +
        "<td>" + escapeHtml(row[0]) + "</td>" +
        "<td>" + escapeHtml(row[1]) + "</td>" +
        "</tr>";

    });

    html += "</table>";

    resultDiv.innerHTML = html;
  }


  // ============================================================
  // MISE À JOUR DE GRIST
  // ============================================================

  async function updateGrist() {

    if (!currentRecord || !currentResult) {
      alert("Aucune donnée à enregistrer.");
      return;
    }

    try {

      const data =
        extractCompanyData(currentResult);

      const updates = {};


      // SIREN
      if (
        data.SIREN &&
        isEmpty(currentRecord[COLONNES.SIREN])
      ) {
        updates[COLONNES.SIREN] = data.SIREN;
      }


      // SIRET
      if (
        data.SIRET &&
        isEmpty(currentRecord[COLONNES.SIRET])
      ) {
        updates[COLONNES.SIRET] = data.SIRET;
      }


      // Dénomination
      if (
        data.RAISON_SOCIALE &&
        isEmpty(currentRecord[COLONNES.RAISON_SOCIALE])
      ) {
        updates[COLONNES.RAISON_SOCIALE] =
          data.RAISON_SOCIALE;
      }


      // Sigle
      if (
        data.SIGLE &&
        isEmpty(currentRecord[COLONNES.SIGLE])
      ) {
        updates[COLONNES.SIGLE] =
          data.SIGLE;
      }


      // Date création
      if (
        data.DATE_CREATION &&
        isEmpty(currentRecord[COLONNES.DATE_CREATION])
      ) {
        updates[COLONNES.DATE_CREATION] =
          data.DATE_CREATION;
      }


      // Date fermeture
      if (
        data.DATE_FERMETURE &&
        isEmpty(currentRecord[COLONNES.DATE_FERMETURE])
      ) {
        updates[COLONNES.DATE_FERMETURE] =
          data.DATE_FERMETURE;
      }


      // Catégorie
      if (
        data.CATEGORIE &&
        isEmpty(currentRecord[COLONNES.CATEGORIE])
      ) {
        updates[COLONNES.CATEGORIE] =
          data.CATEGORIE;
      }


      // Forme juridique
      if (
        data.FORME_JURIDIQUE &&
        isEmpty(currentRecord[COLONNES.FORME_JURIDIQUE])
      ) {
        updates[COLONNES.FORME_JURIDIQUE] =
          data.FORME_JURIDIQUE;
      }


      // APE
      if (
        data.APE &&
        isEmpty(currentRecord[COLONNES.APE])
      ) {
        updates[COLONNES.APE] =
          data.APE;
      }


      // Adresse
      if (
        data.ADRESSE &&
        isEmpty(currentRecord[COLONNES.ADRESSE])
      ) {
        updates[COLONNES.ADRESSE] =
          data.ADRESSE;
      }


      // Code postal
      if (
        data.CODE_POSTAL &&
        isEmpty(currentRecord[COLONNES.CODE_POSTAL])
      ) {
        updates[COLONNES.CODE_POSTAL] =
          data.CODE_POSTAL;
      }


      // Ville
      if (
        data.VILLE &&
        isEmpty(currentRecord[COLONNES.VILLE])
      ) {
        updates[COLONNES.VILLE] =
          data.VILLE;
      }


      // Vérification0
      console.log("ID de la ligne :", currentRecord.id);
      console.log("Données INSEE :", data);
      console.log("Données à écrire v0 :", updates);

      // Rien à modifier
      if (Object.keys(updates).length === 0) {

        document.getElementById("status").textContent =
          "Aucune cellule vide à compléter.";

        return;
      }


      // Écriture dans Grist
      const table = grist.getTable();
      
      // console.log("ID de la ligne :", currentRecord.id);
      // console.log("Données à écrire :", updates);
      // console.log("Colonnes :", COLONNES);
      console.log("ID utilisé pour la mise à jour :", currentRecordId);
      console.log("Données à écrire : v1 ", updates);

      await table.update({
        [currentRecordId]: updates
      });
      
      console.log("Mise à jour Grist terminée");

      // Mise à jour locale de currentRecord 
      // pour garder le widget synchronisé 
      // sans utiliser getRecord() ou updateRecord() 
      Object.assign( 
        currentRecord, 
        updates 
      );     

      document.getElementById("status").className =
        "success";

      document.getElementById("status").textContent =
        Object.keys(updates).length +
        " champ(s) mis à jour dans Grist.";


      // Rechargement de l'enregistrement
      //currentRecord =
      //  await grist.getTable().updateRecord(currentRecord.id, {
      //    SIREN: data.SIREN,
      //    SIRET: data.SIRET,
      //    RAISON_SOCIALE: data.RAISON_SOCIALE,
      //    SIGLE: data.SIGLE,
      //    DATE_CREATION: data.DATE_CREATION,
      //    DATE_FERMETURE: data.DATE_FERMETURE,
      //    CATEGORIE: data.CATEGORIE,
      //    FORME_JURIDIQUE: data.FORME_JURIDIQUE,
      //    APE: data.APE,
      //    ADRESSE: data.ADRESSE,
      //    CODE_POSTAL: data.CODE_POSTAL,
      //  });

    } catch (error) {

      console.error(error);

      document.getElementById("status").className =
        "error";

      document.getElementById("status").textContent =
        "Erreur lors de la mise à jour : " +
        error.message;
    }
  }


  // ============================================================
  // OUTILS
  // ============================================================

  function isEmpty(value) {

    return (
      value === null ||
      value === undefined ||
      value === ""
    );
  }


  function escapeHtml(value) {

    if (
      value === null ||
      value === undefined
    ) {
      return "";
    }

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

</script>

</body>
</html>
