<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <title>Recherche entreprise</title>

  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      color: #333;
    }

    h2 {
      margin-top: 0;
    }

    button {
      padding: 8px 14px;
      margin: 5px 5px 5px 0;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      background: #1976d2;
      color: white;
    }

    button:hover {
      background: #125ca1;
    }

    #status {
      margin: 15px 0;
      padding: 10px;
      border-radius: 5px;
      background: #f2f2f2;
    }

    .success {
      background: #e8f5e9 !important;
      color: #2e7d32;
    }

    .error {
      background: #ffebee !important;
      color: #c62828;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 15px;
    }

    td {
      padding: 7px;
      border-bottom: 1px solid #ddd;
      vertical-align: top;
    }

    td:first-child {
      font-weight: bold;
      width: 40%;
    }

  </style>

</head>


<body>

  <h2>Recherche entreprise</h2>

  <button
    id="searchBtn"
    onclick="searchCompany()"
  >
    🔍 Rechercher
  </button>

  <div id="status">
    Sélectionnez une ligne contenant un SIRET ou un SIREN.
  </div>

  <div id="result"></div>


<script>


// ============================================================
// COLONNES GRIST
// ============================================================

const COLONNES = {

  SIRET: "SIRET",

  SIREN: "SIREN",

  RAISON_SOCIALE: "Dénomination",

  SIGLE: "Sigle",

  DATE_CREATION: "date_creation",

  DATE_FERMETURE: "date_fermeture",

  CATEGORIE: "categorie_entreprise",

  FORME_JURIDIQUE: "forme_juridique",

  APE: "APE",

  ADRESSE: "Adresse",

  CODE_POSTAL: "Code_postal",

  VILLE: "Ville"

};


// ============================================================
// VARIABLES
// ============================================================

let currentRecord = null;

let currentResult = null;


// ============================================================
// CONNEXION GRIST
// ============================================================

grist.ready({

  requiredAccess: "full"

});


grist.onRecord(function(record) {

  currentRecord = record;

  currentResult = null;

  updateInterface();

});


// ============================================================
// INTERFACE
// ============================================================

function updateInterface() {

  const status =
    document.getElementById("status");

  const resultDiv =
    document.getElementById("result");

  resultDiv.innerHTML = "";


  if (!currentRecord) {

    status.className = "";

    status.textContent =
      "Sélectionnez une ligne contenant un SIRET ou un SIREN.";

    return;
  }


  const identifier =
    getIdentifier();


  if (!identifier) {

    status.className = "error";

    status.textContent =
      "Aucun SIRET ou SIREN valide trouvé dans la ligne sélectionnée.";

    return;
  }


  status.className = "";

  status.textContent =
    "Identifiant détecté : " +
    identifier.value +
    " (" +
    identifier.type +
    ")";

}


// ============================================================
// RÉCUPÉRATION DU SIRET / SIREN
// ============================================================

function getIdentifier() {

  if (!currentRecord) {
    return null;
  }


  let siret =
    currentRecord[COLONNES.SIRET];


  let siren =
    currentRecord[COLONNES.SIREN];


  // SIRET

  if (
    siret !== null &&
    siret !== undefined
  ) {

    siret =
      String(siret).replace(/\s/g, "");


    if (/^\d{14}$/.test(siret)) {

      return {

        type: "SIRET",

        value: siret

      };

    }

  }


  // SIREN

  if (
    siren !== null &&
    siren !== undefined
  ) {

    siren =
      String(siren).replace(/\s/g, "");


    if (/^\d{9}$/.test(siren)) {

      return {

        type: "SIREN",

        value: siren

      };

    }

  }


  return null;

}


// ============================================================
// RECHERCHE API
// ============================================================

async function searchCompany() {

  const status =
    document.getElementById("status");

  const resultDiv =
    document.getElementById("result");

  const searchBtn =
    document.getElementById("searchBtn");


  const identifier =
    getIdentifier();


  if (!identifier) {

    status.className = "error";

    status.textContent =
      "Veuillez renseigner un SIRET ou un SIREN valide.";

    return;

  }


  searchBtn.disabled = true;

  status.className = "";

  status.textContent =
    "Recherche en cours pour " +
    identifier.value +
    "…";

  resultDiv.innerHTML = "";


  try {

    const url =
      "https://recherche-entreprises.api.gouv.fr/search?q=" +
      encodeURIComponent(identifier.value) +
      "&page=1&per_page=10";


    const response =
      await fetch(url);


    if (!response.ok) {

      throw new Error(
        "Erreur API : " +
        response.status +
        " " +
        response.statusText
      );

    }


    const data =
      await response.json();


    if (
      !data.results ||
      data.results.length === 0
    ) {

      throw new Error(
        "Aucune entreprise trouvée pour " +
        identifier.value
      );

    }


    let result =
      data.results[0];


    // Recherche exacte du SIRET

    if (identifier.type === "SIRET") {

      const exactMatch =
        data.results.find(function(item) {

          return (
            item.siege &&
            item.siege.siret === identifier.value
          );

        });


      if (exactMatch) {

        result = exactMatch;

      }

    }


    currentResult = result;


    // Affichage

    displayResult(result);


    // MISE À JOUR AUTOMATIQUE DE LA LIGNE

    const nombreChamps =
      await updateGrist(result);


    status.className = "success";

    status.textContent =
      nombreChamps +
      " champ(s) mis à jour automatiquement dans Grist.";


  }


  catch (error) {

    console.error(error);

    status.className = "error";

    status.textContent =
      "Erreur : " +
      error.message;

  }


  finally {

    searchBtn.disabled = false;

  }

}


// ============================================================
// EXTRACTION DES DONNÉES
// ============================================================

function extractCompanyData(result) {

  const siege =
    result.siege || {};


  // Adresse

  let adresse = "";


  if (siege.numero_voie) {

    adresse +=
      siege.numero_voie + " ";

  }


  if (siege.type_voie) {

    adresse +=
      siege.type_voie + " ";

  }


  if (siege.libelle_voie) {

    adresse +=
      siege.libelle_voie;

  }


  adresse =
    adresse.trim();


  // Données

  return {

    SIREN:
      result.siren || "",

    SIRET:
      siege.siret || "",

    RAISON_SOCIALE:
      result.nom_complet ||
      result.nom_raison_sociale ||
      "",

    SIGLE:
      result.sigle || "",

    DATE_CREATION:
      result.date_creation || "",

    DATE_FERMETURE:
      siege.date_fermeture ||
      result.date_fermeture ||
      "",

    CATEGORIE:
      result.categorie_entreprise || "",

    // IMPORTANT :
    // On conserve le CODE INSEE
    // ex. 4120

    FORME_JURIDIQUE:
      result.libelle_forme_juridique ||
      result.nature_juridique ||
      "",

    APE:
      siege.activite_principale || "",

    ADRESSE:
      adresse,

    CODE_POSTAL:
      siege.code_postal || "",

    VILLE:
      siege.libelle_commune || ""

  };

}


// ============================================================
// FORMATAGE DES DATES
// ============================================================

function formatDate(date) {

  if (!date) {

    return "";

  }


  if (
    !/^\d{4}-\d{2}-\d{2}$/.test(date)
  ) {

    return date;

  }


  const parts =
    date.split("-");


  return (
    parts[2] +
    "/" +
    parts[1] +
    "/" +
    parts[0]
  );

}


// ============================================================
// AFFICHAGE
// ============================================================

function displayResult(result) {

  const resultDiv =
    document.getElementById("result");


  const data =
    extractCompanyData(result);


  const rows = [

    ["SIREN", data.SIREN],

    ["SIRET du siège", data.SIRET],

    ["Dénomination", data.RAISON_SOCIALE],

    ["Sigle", data.SIGLE],

    [
      "Date de création",
      formatDate(data.DATE_CREATION)
    ],

    [
      "Date de fermeture",
      formatDate(data.DATE_FERMETURE)
    ],

    [
      "Catégorie d'entreprise",
      data.CATEGORIE
    ],

    [
      "Forme juridique (code INSEE)",
      data.FORME_JURIDIQUE
    ],

    [
      "Code APE",
      data.APE
    ],

    [
      "Adresse",
      data.ADRESSE
    ],

    [
      "Code postal",
      data.CODE_POSTAL
    ],

    [
      "Commune",
      data.VILLE
    ]

  ];


  let html =
    "<table>";


  rows.forEach(function(row) {

    html +=
      "<tr>" +
      "<td>" +
      escapeHtml(row[0]) +
      "</td>" +
      "<td>" +
      escapeHtml(row[1]) +
      "</td>" +
      "</tr>";

  });


  html +=
    "</table>";


  resultDiv.innerHTML =
    html;

}


// ============================================================
// MISE À JOUR AUTOMATIQUE DE LA LIGNE
// ============================================================

async function updateGrist(result) {

  if (!currentRecord) {

    throw new Error(
      "Aucune ligne Grist sélectionnée."
    );

  }


  const data =
    extractCompanyData(result);


  const updates = {};


  // SIREN

  if (
    data.SIREN &&
    isEmpty(
      currentRecord[COLONNES.SIREN]
    )
  ) {

    updates[COLONNES.SIREN] =
      data.SIREN;

  }


  // SIRET

  if (
    data.SIRET &&
    isEmpty(
      currentRecord[COLONNES.SIRET]
    )
  ) {

    updates[COLONNES.SIRET] =
      data.SIRET;

  }


  // Dénomination

  if (
    data.RAISON_SOCIALE &&
    isEmpty(
      currentRecord[
        COLONNES.RAISON_SOCIALE
      ]
    )
  ) {

    updates[
      COLONNES.RAISON_SOCIALE
    ] =
      data.RAISON_SOCIALE;

  }


  // Sigle

  if (
    data.SIGLE &&
    isEmpty(
      currentRecord[COLONNES.SIGLE]
    )
  ) {

    updates[COLONNES.SIGLE] =
      data.SIGLE;

  }


  // Date création

  if (
    data.DATE_CREATION &&
    isEmpty(
      currentRecord[
        COLONNES.DATE_CREATION
      ]
    )
  ) {

    updates[
      COLONNES.DATE_CREATION
    ] =
      data.DATE_CREATION;

  }


  // Date fermeture

  if (
    data.DATE_FERMETURE &&
    isEmpty(
      currentRecord[
        COLONNES.DATE_FERMETURE
      ]
    )
  ) {

    updates[
      COLONNES.DATE_FERMETURE
    ] =
      data.DATE_FERMETURE;

  }


  // Catégorie

  if (
    data.CATEGORIE &&
    isEmpty(
      currentRecord[
        COLONNES.CATEGORIE
      ]
    )
  ) {

    updates[
      COLONNES.CATEGORIE
    ] =
      data.CATEGORIE;

  }


  // Forme juridique
  // On conserve le CODE INSEE

  if (
    data.FORME_JURIDIQUE &&
    isEmpty(
      currentRecord[
        COLONNES.FORME_JURIDIQUE
      ]
    )
  ) {

    updates[
      COLONNES.FORME_JURIDIQUE
    ] =
      data.FORME_JURIDIQUE;

  }


  // APE

  if (
    data.APE &&
    isEmpty(
      currentRecord[COLONNES.APE]
    )
  ) {

    updates[COLONNES.APE] =
      data.APE;

  }


  // Adresse

  if (
    data.ADRESSE &&
    isEmpty(
      currentRecord[COLONNES.ADRESSE]
    )
  ) {

    updates[COLONNES.ADRESSE] =
      data.ADRESSE;

  }


  // Code postal

  if (
    data.CODE_POSTAL &&
    isEmpty(
      currentRecord[
        COLONNES.CODE_POSTAL
      ]
    )
  ) {

    updates[
      COLONNES.CODE_POSTAL
    ] =
      data.CODE_POSTAL;

  }


  // Ville

  if (
    data.VILLE &&
    isEmpty(
      currentRecord[COLONNES.VILLE]
    )
  ) {

    updates[COLONNES.VILLE] =
      data.VILLE;

  }


  // ----------------------------------------------------------
  // ÉCRITURE DANS GRIST
  // ----------------------------------------------------------

  if (
    Object.keys(updates).length === 0
  ) {

    return 0;

  }


  const table =
    grist.getTable();


  await table.update({

    [currentRecord.id]:
      updates

  });


  return Object.keys(updates).length;

}


// ============================================================
// CELLULE VIDE
// ============================================================

function isEmpty(value) {

  return (
    value === null ||
    value === undefined ||
    value === ""
  );

}


// ============================================================
// PROTECTION HTML
// ============================================================

function escapeHtml(value) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }


  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

</script>

</body>

</html>
