<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Recherche SIRET / SIREN</title>

  <!-- API Grist -->
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 15px;
      color: #222;
      background: white;
      font-size: 14px;
    }

    h2 {
      margin-top: 0;
      font-size: 18px;
    }

    .info {
      background: #f5f7fa;
      border-left: 4px solid #1976d2;
      padding: 10px;
      margin-bottom: 12px;
    }

    .status {
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      background: #f1f1f1;
    }

    .success {
      background: #e8f5e9;
      color: #1b5e20;
    }

    .warning {
      background: #fff8e1;
      color: #795548;
    }

    .error {
      background: #ffebee;
      color: #b71c1c;
    }

    button {
      border: none;
      border-radius: 5px;
      padding: 8px 13px;
      margin-right: 6px;
      cursor: pointer;
      font-weight: bold;
      background: #1976d2;
      color: white;
    }

    button:hover {
      background: #125ca1;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    button.secondary {
      background: #eeeeee;
      color: #333;
      border: 1px solid #ccc;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    td {
      padding: 7px;
      border-bottom: 1px solid #ddd;
      vertical-align: top;
    }

    td:first-child {
      width: 40%;
      font-weight: bold;
      color: #666;
    }

    .result {
      margin-top: 15px;
      border: 1px solid #ddd;
      border-radius: 5px;
      padding: 10px;
    }

    .small {
      font-size: 11px;
      color: #777;
      margin-top: 15px;
    }
  </style>
</head>

<body>

<h2>🔎 Recherche entreprise</h2>

<div class="info">
  Le widget recherche automatiquement un <strong>SIRET</strong>.
  Si aucun SIRET n'est disponible, il utilise le <strong>SIREN</strong>.
</div>

<div id="selected">
  Sélectionnez une ligne dans Grist.
</div>

<br>

<button id="searchButton" disabled>
  🔎 Rechercher
</button>

<button id="updateButton" class="secondary" disabled>
  ✓ Mettre à jour Grist
</button>

<div id="status" class="status">
  En attente d'une ligne...
</div>

<div id="result" class="result" style="display:none;">
  <strong>Informations trouvées</strong>

  <table>
    <tbody id="resultTable"></tbody>
  </table>
</div>

<div class="small">
  Source : API Recherche d'entreprises — DINUM / INSEE
</div>


<script>

/* ============================================================
   CONFIGURATION DES COLONNES GRIST
   ============================================================

   IMPORTANT :
   adapte les noms ci-dessous aux noms EXACTS de tes colonnes.

   Par exemple si ta colonne s'appelle "SIRET", laisse "SIRET".
   Si elle s'appelle "Num_SIRET", remplace "SIRET" par "Num_SIRET".
*/

const COLONNES = {

  // Identifiants
  SIRET: "SIRET",
  SIREN: "SIREN",

  // Informations entreprise
  RAISON_SOCIALE: "Dénomination",
  SIGLE: "Sigle",
  DATE_CREATION: "date_creation",
  DATE_FERMETURE: "date_fermeture",
  CATEGORIE: "categorie_entreprise",
  FORME_JURIDIQUE: "forme_juridique",
  APE: "APE",

  // Adresse
  ADRESSE: "Adresse",
  CODE_POSTAL: "Code_postal",
  VILLE: "Ville"
};


/* ============================================================
   VARIABLES
   ============================================================ */

let currentRecord = null;
let currentResult = null;


/* ============================================================
   INITIALISATION GRIST
   ============================================================ */

grist.ready({
  requiredAccess: "full"
});


/*
 * Grist nous transmet la ligne sélectionnée.
 */
grist.onRecord(function(record) {

  currentRecord = record;
  currentResult = null;

  updateInterface();

});


/* ============================================================
   OUTILS
   ============================================================ */

function cleanNumber(value) {

  if (value === null || value === undefined) {
    return "";
  }

  /*
   * Retire les espaces, tirets, etc.
   */
  return String(value).replace(/\D/g, "");
}


/*
 * Vérifie si une cellule est vide.
 */
function isEmpty(value) {

  return (
    value === null ||
    value === undefined ||
    value === ""
  );

}


/*
 * Echappement HTML
 */
function escapeHtml(value) {

  if (value === null || value === undefined) {
    return "";
  }

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* ============================================================
   DETERMINER SIRET OU SIREN
   ============================================================ */

function getIdentifier() {

  if (!currentRecord) {
    return null;
  }


  /*
   * 1. PRIORITE AU SIRET
   */

  const siret = cleanNumber(
    currentRecord[COLONNES.SIRET]
  );

  if (siret.length === 14) {

    return {
      type: "SIRET",
      value: siret
    };

  }


  /*
   * 2. SINON SIREN
   */

  const siren = cleanNumber(
    currentRecord[COLONNES.SIREN]
  );

  if (siren.length === 9) {

    return {
      type: "SIREN",
      value: siren
    };

  }


  /*
   * Rien trouvé
   */

  return null;

}


/* ============================================================
   MISE A JOUR DE L'INTERFACE
   ============================================================ */

function updateInterface() {

  const selected = document.getElementById("selected");

  const searchButton =
    document.getElementById("searchButton");

  const updateButton =
    document.getElementById("updateButton");


  if (!currentRecord) {

    selected.innerHTML =
      "Sélectionnez une ligne dans Grist.";

    searchButton.disabled = true;
    updateButton.disabled = true;

    return;
  }


  const identifier = getIdentifier();


  if (!identifier) {

    selected.innerHTML =
      "<strong>Ligne sélectionnée.</strong><br>" +
      "Aucun SIRET (14 chiffres) ni SIREN (9 chiffres) valide.";

    searchButton.disabled = true;
    updateButton.disabled = true;

    return;
  }


  selected.innerHTML =
    "<strong>Ligne sélectionnée</strong><br>" +
    identifier.type +
    " utilisé : <strong>" +
    escapeHtml(identifier.value) +
    "</strong>";


  searchButton.disabled = false;
  updateButton.disabled = !currentResult;

}


/* ============================================================
   RECHERCHE API
   ============================================================ */

async function searchCompany() {

  const identifier = getIdentifier();


  if (!identifier) {

    showStatus(
      "Aucun SIRET ou SIREN valide trouvé.",
      "warning"
    );

    return;
  }


  showStatus(
    "Recherche en cours..."
  );


  document.getElementById("result").style.display =
    "none";


  currentResult = null;


  try {

    /*
     * API officielle :
     *
     * https://recherche-entreprises.api.gouv.fr/search
     *
     * Pour un SIRET ou SIREN, q suffit.
     */

    const url =
      "https://recherche-entreprises.api.gouv.fr/search" +
      "?q=" +
      encodeURIComponent(identifier.value) +
      "&page=1" +
      "&per_page=10";


    const response =
      await fetch(url);


    if (!response.ok) {

      throw new Error(
        "Erreur HTTP " + response.status
      );

    }


    const data =
      await response.json();


    if (
      !data.results ||
      data.results.length === 0
    ) {

      showStatus(
        "Aucune entreprise trouvée pour " +
        identifier.value,
        "warning"
      );

      return;
    }


    /*
     * Pour une recherche directe SIREN/SIRET,
     * le premier résultat est normalement le bon.
     *
     * On vérifie quand même le SIRET lorsqu'on
     * en a fourni un.
     */

    let result = data.results[0];


    if (identifier.type === "SIRET") {

      const exactMatch =
        data.results.find(function(r) {

          return (
            cleanNumber(
              r.siege?.siret
            ) === identifier.value
          );

        });


      if (exactMatch) {
        result = exactMatch;
      }

    }


    currentResult = result;


    displayResult(result);


    showStatus(
      "Entreprise trouvée. Vérifie les informations puis clique sur « Mettre à jour Grist ».",
      "success"
    );


    document.getElementById(
      "updateButton"
    ).disabled = false;


  } catch (error) {

    console.error(error);

    showStatus(
      "Erreur lors de la recherche : " +
      error.message,
      "error"
    );

  }

}


/* ============================================================
   EXTRACTION DES DONNEES
   ============================================================ */

function extractCompanyData(result) {

  const siege = result.siege || {};

  // Construction de l'adresse
  let adresse = "";

  if (siege.numero_voie) {
    adresse += siege.numero_voie + " ";
  }

  if (siege.type_voie) {
    adresse += siege.type_voie + " ";
  }

  if (siege.libelle_voie) {
    adresse += siege.libelle_voie;
  }

  adresse = adresse.trim();


  return {

    SIREN:
      result.siren || "",

    SIRET:
      siege.siret || "",

    RAISON_SOCIALE:
      result.nom_complet ||
      result.nom_raison_sociale ||
      "",

    DATE_CREATION:
      result.date_creation ||
      "",

    DATE_FERMETURE:
      siege.date_fermeture ||
      "",

    CATEGORIE:
      result.categorie_entreprise ||
      "",

/*    FORME_JURIDIQUE:
      result.nature_juridique ||
      "",*/
    
    FORME_JURIDIQUE:
      result.libelle_nature_juridique ||
      result.nature_juridique_libelle ||
      result.nature_juridique ||
      "",

    APE:
      siege.activite_principale ||
      "",

    SIGLE:
      result.sigle ||
      "",
    
    ADRESSE:
      adresse,

    CODE_POSTAL:
      siege.code_postal ||
      "",

    VILLE:
      siege.libelle_commune ||
      ""

  };
}

/* ============================================================
   AFFICHAGE
   ============================================================ */

function displayResult(result) {

  const data =
    extractCompanyData(result);


  const rows = [

    ["SIREN", data.SIREN],

    ["SIRET du siège", data.SIRET],

    ["Raison sociale", data.RAISON_SOCIALE],

    ["Code APE / NAF", data.APE],

    ["Adresse", data.ADRESSE],

    ["Code postal", data.CODE_POSTAL],

    ["Commune", data.COMMUNE],

    ["État administratif", data.ETAT]

  ];


  const table =
    document.getElementById("resultTable");


  table.innerHTML = "";


  rows.forEach(function(row) {

    const tr =
      document.createElement("tr");


    const td1 =
      document.createElement("td");

    td1.textContent =
      row[0];


    const td2 =
      document.createElement("td");

    td2.innerHTML =
      row[1]
        ? escapeHtml(row[1])
        : "<em>—</em>";


    tr.appendChild(td1);
    tr.appendChild(td2);


    table.appendChild(tr);

  });


  document.getElementById(
    "result"
  ).style.display = "block";

}


/* ============================================================
   MESSAGE
   ============================================================ */

function showStatus(message, type) {

  const status =
    document.getElementById("status");


  status.textContent =
    message;


  status.className =
    "status " +
    (type || "");

}


/* ============================================================
   MISE A JOUR DE GRIST
   ============================================================ */


async function updateGrist() {

  if (!currentRecord || !currentResult) {
    return;
  }

  const data = extractCompanyData(currentResult);

  const updates = {};


  // SIREN
  if (
    data.SIREN &&
    isEmpty(currentRecord[COLONNES.SIREN])
  ) {
    updates[COLONNES.SIREN] = data.SIREN;
  }


  // SIRET
  if (
    data.SIRET &&
    isEmpty(currentRecord[COLONNES.SIRET])
  ) {
    updates[COLONNES.SIRET] = data.SIRET;
  }


  // Raison sociale
  if (
    data.RAISON_SOCIALE &&
    isEmpty(currentRecord[COLONNES.RAISON_SOCIALE])
  ) {
    updates[COLONNES.RAISON_SOCIALE] =
      data.RAISON_SOCIALE;
  }


  // APE
  if (
    data.APE &&
    isEmpty(currentRecord[COLONNES.APE])
  ) {
    updates[COLONNES.APE] = data.APE;
  }


  // Adresse
  if (
    data.ADRESSE &&
    isEmpty(currentRecord[COLONNES.ADRESSE])
  ) {
    updates[COLONNES.ADRESSE] = data.ADRESSE;
  }


  // Code postal
  if (
    data.CODE_POSTAL &&
    isEmpty(currentRecord[COLONNES.CODE_POSTAL])
  ) {
    updates[COLONNES.CODE_POSTAL] =
      data.CODE_POSTAL;
  }


  // Commune
  if (
    data.COMMUNE &&
    isEmpty(currentRecord[COLONNES.COMMUNE])
  ) {
    updates[COLONNES.COMMUNE] =
      data.COMMUNE;
  }


  // Etat administratif
  if (
    data.ETAT &&
    isEmpty(currentRecord[COLONNES.ETAT])
  ) {
    updates[COLONNES.ETAT] =
      data.ETAT;
  }


  if (Object.keys(updates).length === 0) {

    showStatus(
      "Aucune cellule vide à compléter.",
      "warning"
    );

    return;
  }


  try {

    /*
     * selectedTable.update() met à jour la ligne
     * sélectionnée dans la table du widget.
     */

    await grist.selectedTable.update({
      [currentRecord.id]: updates
    });


    showStatus(
      "✓ Grist a été mis à jour.",
      "success"
    );


  } catch (error) {

    console.error(error);

    showStatus(
      "Erreur lors de la mise à jour de Grist : " +
      error.message,
      "error"
    );
  }
}


  


/* ============================================================
   BOUTONS
   ============================================================ */

document
  .getElementById("searchButton")
  .addEventListener(
    "click",
    searchCompany
  );


document
  .getElementById("updateButton")
  .addEventListener(
    "click",
    updateGrist
  );

</script>

</body>
</html>
